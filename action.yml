name: Check refactoring prompts
description: Structurally check code-refactoring prompts and annotate problems in the pull request.
author: f-e-n-g-0531

branding:
  icon: check-circle
  color: blue

inputs:
  files:
    description: One file or directory, or a one-path-per-line list. Directories are scanned recursively for *.prompt, *.prompt.md and *.prompt.txt.
    required: false
    default: "."
  include:
    description: Comma-separated glob patterns for directory scans.
    required: false
    default: "*.prompt,*.prompt.md,*.prompt.txt"
  strict:
    description: Treat warnings as failures (true / false).
    required: false
    default: "true"
  changed-only:
    description: Only check prompt files changed since the pull request base (requires actions/checkout with fetch-depth 0).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check prompts
      shell: bash
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_INCLUDE: ${{ inputs.include }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_CHANGED_ONLY: ${{ inputs.changed-only }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        set -euo pipefail
        args=(--format github)
        if [ "${INPUT_STRICT}" = "true" ]; then
          args+=(--strict)
        fi
        if [ -n "${INPUT_INCLUDE}" ]; then
          args+=(--include "${INPUT_INCLUDE}")
        fi
        if [ "${INPUT_CHANGED_ONLY}" = "true" ]; then
          base="${BASE_SHA:-}"
          case "$base" in
            "" | 0000000000000000000000000000000000000000)
              if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
                echo "changed-only needs a full checkout when no base is available" >&2
                exit 2
              fi
              if git rev-parse --verify --quiet HEAD^ >/dev/null; then
                args+=(--changed HEAD^)
              else
                args+=(--changed-root)
              fi
              ;;
            *) args+=(--changed "$base") ;;
          esac
          python3 "${GITHUB_ACTION_PATH}/scripts/check_prompt.py" "${args[@]}"
        else
          files=()
          if [[ "$INPUT_FILES" == *$'\n'* ]]; then
            while IFS= read -r file; do
              [[ -z "$file" ]] || files+=("$file")
            done <<< "$INPUT_FILES"
          elif [[ -e "$INPUT_FILES" ]]; then
            files+=("$INPUT_FILES")
          else
            # Preserve the legacy space-separated list when it is not a single path.
            # Retain legacy pathname expansion as well as whitespace splitting.
            # shellcheck disable=SC2206
            files=($INPUT_FILES)
          fi
          if (( ${#files[@]} == 0 )); then
            echo "no files provided" >&2
            exit 2
          fi
          python3 "${GITHUB_ACTION_PATH}/scripts/check_prompt.py" "${args[@]}" -- "${files[@]}"
        fi
