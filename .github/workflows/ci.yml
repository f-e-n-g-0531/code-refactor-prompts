name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate structure, frontmatter, links and copy
        run: python3 .github/scripts/validate_skill.py

      - name: Check the local gate wiring
        run: python3 scripts/run_checks.py --list

      - name: Audit master templates and specialised variants
        run: python3 .github/scripts/audit_templates.py

      - name: Check source links (offline)
        run: python3 scripts/check_sources.py

      - name: Self-test prompt checker
        run: |
          set -euo pipefail
          expect_exit() {
            local expected="$1" actual=0
            shift
            "$@" || actual=$?
            if [[ "$actual" != "$expected" ]]; then
              printf '::error::Expected exit %s, got %s: %s\n' "$expected" "$actual" "$*" >&2
              return 1
            fi
          }
          python3 scripts/check_prompt.py scripts/fixtures/good-prompt.txt
          python3 scripts/check_prompt.py scripts/fixtures/good-go-prompt.txt
          python3 scripts/check_prompt.py scripts/fixtures/good-en-prompt.txt
          for fixture in bad-prompt.txt bad-language-prompt.txt bad-antipattern-prompt.txt bad-en-prompt.txt; do
            expect_exit 1 python3 scripts/check_prompt.py "scripts/fixtures/$fixture"
          done
          expect_exit 1 python3 scripts/check_prompt.py scripts/fixtures/good-prompt.txt --lang python
          python3 scripts/check_prompt.py scripts/fixtures/weak-prompt.txt > /dev/null
          expect_exit 1 python3 scripts/check_prompt.py scripts/fixtures/weak-prompt.txt --strict
          skeleton="$(expect_exit 1 python3 scripts/check_prompt.py scripts/fixtures/bad-prompt.txt --skeleton)"
          if ! grep -q "缺失段落骨架" <<< "$skeleton"; then
            echo "::error::--skeleton did not emit missing-segment skeletons"
            exit 1
          fi
          python3 scripts/check_prompt.py scripts/fixtures/good-prompt.txt --json > /dev/null

          python3 scripts/compose_prompt.py --code scripts/fixtures/sample.go --project order-pricing --out /tmp/composed-zh.txt
          python3 scripts/check_prompt.py /tmp/composed-zh.txt
          python3 scripts/compose_prompt.py --code scripts/fixtures/sample.py --output-lang en --out /tmp/composed-en.txt
          python3 scripts/check_prompt.py /tmp/composed-en.txt
          expect_exit 1 python3 scripts/compose_prompt.py --code scripts/fixtures/sample.go --test-command pytest
          cp scripts/fixtures/bad-prompt.txt /tmp/bad-fix.txt
          expect_exit 1 python3 scripts/check_prompt.py /tmp/bad-fix.txt
          python3 scripts/check_prompt.py /tmp/bad-fix.txt --fix > /dev/null
          python3 scripts/check_prompt.py /tmp/bad-fix.txt
          echo "prompt checker and composer self-test OK"

      - name: Test GitHub annotation output
        run: |
          set -euo pipefail
          status=0
          output="$(python3 scripts/check_prompt.py --format github scripts/fixtures/bad-prompt.txt)" || status=$?
          if [[ "$status" != 1 ]]; then
            echo "::error::Expected exit 1 for a bad prompt, got $status"
            exit 1
          fi
          grep -Eq '::error file=scripts/fixtures/bad-prompt\.txt(,line=[0-9]+)?::' <<< "$output"
          status=0
          python3 scripts/check_prompt.py --format github --json scripts/fixtures/good-prompt.txt || status=$?
          if [[ "$status" != 2 ]]; then
            echo "::error::Expected exit 2 for incompatible options, got $status"
            exit 1
          fi
          echo "GitHub annotations OK"

      - name: Test the prompt tooling
        env:
          # A dedicated --verify step below runs both extracted gates.
          SKIP_NESTED_PACKAGE_VERIFY: "1"
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Test the packaged pre-commit console script
        run: |
          set -euo pipefail
          python3 -m venv /tmp/precommit-venv
          /tmp/precommit-venv/bin/pip install --quiet --disable-pip-version-check .
          /tmp/precommit-venv/bin/code-refactor-prompt-check --strict scripts/fixtures/good-prompt.txt
          status=0
          /tmp/precommit-venv/bin/code-refactor-prompt-check --strict scripts/fixtures/bad-prompt.txt || status=$?
          if [[ "$status" != 1 ]]; then
            echo "::error::Expected console script exit 1 for a bad prompt, got $status"
            exit 1
          fi
          echo "pre-commit console script OK"

      - name: Test the pre-commit hook end to end
        run: python3 .github/scripts/verify_precommit.py

      - name: Set up Node.js for the TypeScript example
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Java for the Java example
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify examples are executable
        run: python3 .github/scripts/verify_examples.py --require-all

      - name: Dry-run release packaging and extracted fast gates
        run: python3 .github/scripts/package_skill.py --label ci --verify

  test-windows:
    name: Test tooling on Windows
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate structure
        run: python .github/scripts/validate_skill.py

      - name: Audit templates
        run: python .github/scripts/audit_templates.py

      - name: Run tooling tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Check source links (offline)
        run: python scripts/check_sources.py

      - name: Install package and test checker
        run: |
          python -m pip install --quiet --disable-pip-version-check .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          code-refactor-prompt-check --strict scripts/fixtures/good-prompt.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          code-refactor-prompt-check --strict scripts/fixtures/bad-prompt.txt
          if ($LASTEXITCODE -ne 1) {
            Write-Error "Expected checker exit 1 for a bad prompt, got $LASTEXITCODE"
            exit 1
          }
          # The bad prompt is expected to fail; reset the exit code so pwsh does
          # not mark the whole step as failed on its final command.
          exit 0

  test-python39:
    name: Test tooling on Python 3.9
    # Python 3.9 binaries are unavailable for Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Validate structure
        run: python .github/scripts/validate_skill.py

      - name: Run tooling tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Check source links (offline)
        run: python scripts/check_sources.py

      - name: Install package and test console script
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check .
          code-refactor-prompt-check --strict scripts/fixtures/good-prompt.txt
          status=0
          code-refactor-prompt-check --strict scripts/fixtures/bad-prompt.txt || status=$?
          if [[ "$status" != 1 ]]; then
            echo "::error::Expected checker exit 1 for a bad prompt, got $status"
            exit 1
          fi

