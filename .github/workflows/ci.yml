name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate structure, frontmatter, links and copy
        run: python3 .github/scripts/validate_skill.py

      - name: Check the local gate wiring
        run: python3 scripts/run_checks.py --list

      - name: Audit master templates and specialised variants
        run: python3 .github/scripts/audit_templates.py

      - name: Check source links (offline)
        run: python3 scripts/check_sources.py

      - name: Self-test prompt checker
        run: |
          set -euo pipefail
          python3 scripts/check_prompt.py scripts/fixtures/good-prompt.txt
          python3 scripts/check_prompt.py scripts/fixtures/good-go-prompt.txt
          python3 scripts/check_prompt.py scripts/fixtures/good-en-prompt.txt
          for fixture in bad-prompt.txt bad-language-prompt.txt bad-antipattern-prompt.txt bad-en-prompt.txt; do
            if python3 scripts/check_prompt.py "scripts/fixtures/$fixture"; then
              echo "::error::check_prompt.py should reject scripts/fixtures/$fixture"
              exit 1
            fi
          done
          if python3 scripts/check_prompt.py scripts/fixtures/good-prompt.txt --lang python; then
            echo "::error::check_prompt.py should reject a mismatched --lang override"
            exit 1
          fi
          python3 scripts/check_prompt.py scripts/fixtures/weak-prompt.txt > /dev/null
          if python3 scripts/check_prompt.py scripts/fixtures/weak-prompt.txt --strict > /dev/null 2>&1; then
            echo "::error::--strict should turn the weak prompt's warnings into a failure"
            exit 1
          fi
          skeleton="$(python3 scripts/check_prompt.py scripts/fixtures/bad-prompt.txt --skeleton || true)"
          if ! grep -q "缺失段落骨架" <<< "$skeleton"; then
            echo "::error::--skeleton did not emit missing-segment skeletons"
            exit 1
          fi
          python3 scripts/check_prompt.py scripts/fixtures/good-prompt.txt --json > /dev/null

          python3 scripts/compose_prompt.py --code scripts/fixtures/sample.go --project order-pricing --out /tmp/composed-zh.txt
          python3 scripts/check_prompt.py /tmp/composed-zh.txt
          python3 scripts/compose_prompt.py --code scripts/fixtures/sample.py --output-lang en --out /tmp/composed-en.txt
          python3 scripts/check_prompt.py /tmp/composed-en.txt
          if python3 scripts/compose_prompt.py --code scripts/fixtures/sample.go --test-command pytest > /dev/null 2>&1; then
            echo "::error::compose_prompt.py should refuse a prompt that fails the self-check"
            exit 1
          fi
          cp scripts/fixtures/bad-prompt.txt /tmp/bad-fix.txt
          if python3 scripts/check_prompt.py /tmp/bad-fix.txt > /dev/null 2>&1; then
            echo "::error::bad fixture should fail before --fix"
            exit 1
          fi
          python3 scripts/check_prompt.py /tmp/bad-fix.txt --fix > /dev/null
          python3 scripts/check_prompt.py /tmp/bad-fix.txt
          echo "prompt checker and composer self-test OK"

      - name: Test GitHub annotation output
        run: |
          set -euo pipefail
          output="$(python3 scripts/check_prompt.py --format github scripts/fixtures/bad-prompt.txt || true)"
          grep -Eq '::error file=scripts/fixtures/bad-prompt\.txt(,line=[0-9]+)?::' <<< "$output"
          if python3 scripts/check_prompt.py --format github --json scripts/fixtures/good-prompt.txt; then
            echo "::error::--format github must not combine with --json"
            exit 1
          fi
          echo "GitHub annotations OK"

      - name: Test the prompt tooling
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Test the packaged pre-commit console script
        run: |
          set -euo pipefail
          python3 -m venv /tmp/precommit-venv
          /tmp/precommit-venv/bin/pip install --quiet --disable-pip-version-check .
          /tmp/precommit-venv/bin/code-refactor-prompt-check --strict scripts/fixtures/good-prompt.txt
          if /tmp/precommit-venv/bin/code-refactor-prompt-check --strict scripts/fixtures/bad-prompt.txt; then
            echo "::error::the console script must reject a bad prompt"
            exit 1
          fi
          echo "pre-commit console script OK"

      - name: Test the pre-commit hook end to end
        run: |
          set -euo pipefail
          python3 -m venv /tmp/precommit-e2e-venv
          /tmp/precommit-e2e-venv/bin/pip install --quiet --disable-pip-version-check pre-commit
          mkdir -p .pre-commit-e2e
          cp scripts/fixtures/good-prompt.txt .pre-commit-e2e/order.prompt.txt
          cp scripts/fixtures/bad-prompt.txt .pre-commit-e2e/bad.prompt.txt
          /tmp/precommit-e2e-venv/bin/pre-commit try-repo . --ref HEAD --files .pre-commit-e2e/order.prompt.txt
          if /tmp/precommit-e2e-venv/bin/pre-commit try-repo . --ref HEAD --files .pre-commit-e2e/bad.prompt.txt; then
            echo "::error::the pre-commit hook must reject a bad prompt"
            exit 1
          fi
          rm -rf .pre-commit-e2e
          echo "pre-commit hook end-to-end OK"

      - name: Set up Node.js for the TypeScript example
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify examples are executable
        run: python3 .github/scripts/verify_examples.py --require-all

      - name: Dry-run release packaging
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix=code-refactor-prompts/ -o dist/skill.zip HEAD \
            SKILL.md README.md README.en.md CONTRIBUTING.md CHANGELOG.md LICENSE .gitignore .pre-commit-hooks.yaml pyproject.toml action.yml references examples scripts
          python3 - <<'PY'
          import zipfile
          names = zipfile.ZipFile("dist/skill.zip").namelist()
          required = [
              "code-refactor-prompts/SKILL.md",
              "code-refactor-prompts/references/template-en.md",
              "code-refactor-prompts/examples/rust-legacy-order-total.md",
              "code-refactor-prompts/examples/typescript-legacy-characterisation.md",
              "code-refactor-prompts/examples/csharp-legacy-order-total.md",
              "code-refactor-prompts/examples/sql-legacy-report-equivalence.md",
              "code-refactor-prompts/scripts/check_prompt.py",
              "code-refactor-prompts/.pre-commit-hooks.yaml",
              "code-refactor-prompts/pyproject.toml",
              "code-refactor-prompts/action.yml",
              "code-refactor-prompts/CONTRIBUTING.md",
          ]
          for entry in required:
              assert entry in names, f"missing from package: {entry}"
          assert any(n.startswith("code-refactor-prompts/references/") for n in names), "references missing"
          assert not any("/.github/" in n for n in names), "package must not include .github"
          print("package OK:", len(names), "entries")
          PY

  test-windows:
    name: Test tooling on Windows
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate structure
        run: python .github/scripts/validate_skill.py

      - name: Audit templates
        run: python .github/scripts/audit_templates.py

      - name: Run tooling tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Check source links (offline)
        run: python scripts/check_sources.py

      - name: Install package and test console script
        run: |
          python -m pip install --quiet --disable-pip-version-check .
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m check_prompt --strict scripts/fixtures/good-prompt.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m check_prompt --strict scripts/fixtures/bad-prompt.txt
          if ($LASTEXITCODE -eq 0) {
            Write-Error "the console script must reject a bad prompt"
            exit 1
          }
          # The bad prompt is expected to fail; reset the exit code so pwsh does
          # not mark the whole step as failed on its final command.
          exit 0
