name: Link check

on:
  schedule:
    # Weekly on Monday 03:17 UTC; sources rot silently otherwise.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    name: Check external sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Request every source URL
        run: python3 scripts/check_sources.py --online --timeout 20
