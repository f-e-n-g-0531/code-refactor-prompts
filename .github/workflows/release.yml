name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已存在标签（如 v1.0.0）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: meta
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          # Tag shape must stay in sync with validate_tag() in
          # .github/scripts/release_notes.py (authoritative).
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::tag must look like vX.Y.Z"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Validate release tag and build notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: python3 .github/scripts/release_notes.py "$TAG" > .github/release-notes.md

      - name: Validate skill
        run: python3 .github/scripts/validate_skill.py

      - name: Audit master templates and specialised variants
        run: python3 .github/scripts/audit_templates.py

      - name: Test the prompt tooling
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Set up Node.js for the TypeScript example
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Java for the Java example
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify examples are executable
        run: python3 .github/scripts/verify_examples.py --require-all

      - name: Test the pre-commit hook end to end
        run: |
          set -euo pipefail
          python3 -m venv /tmp/precommit-e2e-venv
          /tmp/precommit-e2e-venv/bin/pip install --quiet --disable-pip-version-check pre-commit
          mkdir -p .pre-commit-e2e
          cp scripts/fixtures/good-prompt.txt .pre-commit-e2e/order.prompt.txt
          cp scripts/fixtures/bad-prompt.txt .pre-commit-e2e/bad.prompt.txt
          /tmp/precommit-e2e-venv/bin/pre-commit try-repo . --ref HEAD --files .pre-commit-e2e/order.prompt.txt
          if /tmp/precommit-e2e-venv/bin/pre-commit try-repo . --ref HEAD --files .pre-commit-e2e/bad.prompt.txt; then
            echo "::error::the pre-commit hook must reject a bad prompt"
            exit 1
          fi
          rm -rf .pre-commit-e2e
          echo "pre-commit hook end-to-end OK"

      - name: Build and verify release artifacts
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: python3 .github/scripts/package_skill.py --label "$TAG" --verify

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          TITLE="code-refactor-prompts ${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file .github/release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --title "$TITLE" --notes-file .github/release-notes.md \
              "dist/code-refactor-prompts-${TAG}.zip" \
              "dist/code-refactor-prompts-${TAG}.tar.gz" \
              "dist/SHA256SUMS.txt"
          fi
          gh release view "$TAG" --json tagName,url,assets --jq '"release: " + .tagName + " " + .url'
