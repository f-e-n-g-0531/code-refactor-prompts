name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已存在标签（如 v1.0.0）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Validate skill
        run: python3 .github/scripts/validate_skill.py

      - name: Audit master templates and specialised variants
        run: python3 .github/scripts/audit_templates.py

      - name: Test the prompt tooling
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Set up Node.js for the TypeScript example
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify examples are executable
        run: python3 .github/scripts/verify_examples.py --require-all

      - name: Test the pre-commit hook end to end
        run: |
          set -euo pipefail
          python3 -m venv /tmp/precommit-e2e-venv
          /tmp/precommit-e2e-venv/bin/pip install --quiet --disable-pip-version-check pre-commit
          mkdir -p .pre-commit-e2e
          cp scripts/fixtures/good-prompt.txt .pre-commit-e2e/order.prompt.txt
          cp scripts/fixtures/bad-prompt.txt .pre-commit-e2e/bad.prompt.txt
          /tmp/precommit-e2e-venv/bin/pre-commit try-repo . --ref HEAD --files .pre-commit-e2e/order.prompt.txt
          if /tmp/precommit-e2e-venv/bin/pre-commit try-repo . --ref HEAD --files .pre-commit-e2e/bad.prompt.txt; then
            echo "::error::the pre-commit hook must reject a bad prompt"
            exit 1
          fi
          rm -rf .pre-commit-e2e
          echo "pre-commit hook end-to-end OK"

      - name: Build release notes from CHANGELOG
        run: python3 .github/scripts/release_notes.py "${{ steps.meta.outputs.tag }}" > release-notes.md

      - name: Build release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${{ steps.meta.outputs.tag }}"
          PREFIX="code-refactor-prompts"
          git archive --format=zip --prefix="${PREFIX}/" -o "dist/${PREFIX}-${TAG}.zip" HEAD \
            SKILL.md README.md README.en.md CONTRIBUTING.md CHANGELOG.md LICENSE .gitignore .pre-commit-hooks.yaml pyproject.toml action.yml references examples scripts
          git archive --format=tar.gz --prefix="${PREFIX}/" -o "dist/${PREFIX}-${TAG}.tar.gz" HEAD \
            SKILL.md README.md README.en.md CONTRIBUTING.md CHANGELOG.md LICENSE .gitignore .pre-commit-hooks.yaml pyproject.toml action.yml references examples scripts
          ( cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt )
          ls -lh dist

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, zipfile
          zips = glob.glob("dist/code-refactor-prompts-*.zip")
          assert len(zips) == 1, zips
          names = zipfile.ZipFile(zips[0]).namelist()
          required = [
              "code-refactor-prompts/SKILL.md",
              "code-refactor-prompts/pyproject.toml",
              "code-refactor-prompts/.pre-commit-hooks.yaml",
              "code-refactor-prompts/scripts/check_prompt.py",
          ]
          missing = [entry for entry in required if entry not in names]
          assert not missing, f"missing from artifact: {missing}"
          assert not any("/.github/" in name for name in names), "artifact must not contain .github"
          print("release artifact OK:", len(names), "entries")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="code-refactor-prompts ${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --title "$TITLE" --notes-file release-notes.md \
              "dist/code-refactor-prompts-${TAG}.zip" \
              "dist/code-refactor-prompts-${TAG}.tar.gz" \
              "dist/SHA256SUMS.txt"
          fi
          gh release view "$TAG" --json tagName,url,assets --jq '"release: " + .tagName + " " + .url'
