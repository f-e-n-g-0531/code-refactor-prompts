name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已存在标签（如 v1.0.0）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: meta
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Validate skill
        run: python3 .github/scripts/validate_skill.py

      - name: Audit master templates and specialised variants
        run: python3 .github/scripts/audit_templates.py

      - name: Set up Node.js for the TypeScript example
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify examples are executable
        run: python3 .github/scripts/verify_examples.py --require-all

      - name: Build release notes from CHANGELOG
        run: python3 .github/scripts/release_notes.py "${{ steps.meta.outputs.tag }}" > release-notes.md

      - name: Build release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${{ steps.meta.outputs.tag }}"
          PREFIX="code-refactor-prompts"
          git archive --format=zip --prefix="${PREFIX}/" -o "dist/${PREFIX}-${TAG}.zip" HEAD \
            SKILL.md README.md README.en.md CHANGELOG.md LICENSE .gitignore references examples scripts
          git archive --format=tar.gz --prefix="${PREFIX}/" -o "dist/${PREFIX}-${TAG}.tar.gz" HEAD \
            SKILL.md README.md README.en.md CHANGELOG.md LICENSE .gitignore references examples scripts
          ( cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt )
          ls -lh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="code-refactor-prompts ${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --title "$TITLE" --notes-file release-notes.md \
              "dist/code-refactor-prompts-${TAG}.zip" \
              "dist/code-refactor-prompts-${TAG}.tar.gz" \
              "dist/SHA256SUMS.txt"
          fi
          gh release view "$TAG" --json tagName,url,assets --jq '"release: " + .tagName + " " + .url'
